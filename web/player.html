    <style>
        /* 基础样式重置 - 确保无横向滚动条 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
        }
        
        html, body {
            width: 100%;
            overflow-x: hidden; /* 防止横向滚动 */
        }
        
        body {
            background-color: #000;
            color: #fff;
            line-height: 1.6;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        
        a {
            text-decoration: none;
            color: inherit;
        }
        
        ul, ol {
            list-style: none;
        }
        
        .container {
            width: 100%;
            max-width: 1440px;
            margin: 0 auto;
            padding: 0 15px;

        /* 播放页样式 */
        .player-container {
            background-color: #000;
            border-radius: 10px;
            overflow: hidden;
            margin-bottom: 25px;
            width: 100%;

        #video-player {
            width: 100%;
            height: auto;
            max-height: 70vh;
            background-color: #000;
            aspect-ratio: 16/9;

            padding: 20px;

        .video-main-title {

            margin-bottom: 12px;
        }
        
        .video-stats {
            display: flex;
            gap: 15px;
            color: #aaa;
            margin-bottom: 15px;
            flex-wrap: wrap;
        }
        
        .video-description {
            color: #ccc;
            line-height: 1.6;
            font-size: 14px;
        }
        

        
        /* =============== 响应式设计 =============== */
        /* 超大屏幕 (> 1600px) */
        @media (min-width: 1601px) {
            .container {
                max-width: 1600px;
            }
        }
        
        /* 大屏幕 (1200px - 1600px) */
        @media (min-width: 1200px) and (max-width: 1600px) {
            .container {
                max-width: 1200px;
            }
        }
        
        /* 中等屏幕 (992px - 1199px) */
        @media (min-width: 992px) and (max-width: 1199px) {
            .container {
                max-width: 992px;
            }
        }
        
        /* 小屏幕 (768px - 991px) */
        @media (min-width: 768px) and (max-width: 991px) {
            .container {
                max-width: 768px;
                padding: 0 12px;
            }
            
            #video-player {
                max-height: 50vh;
            }
            
            .video-main-title {
                font-size: 20px;
            }
        }
        
        /* 移动端 (576px - 767px) */
        @media (min-width: 576px) and (max-width: 767px) {
            .container {
                max-width: 576px;
                padding: 0 10px;
            }
            
            #video-player {
                max-height: 50vh;
            }
            
            .video-main-title {
                font-size: 20px;
            }
        }
        
        /* 瓒呭皬灞忓箷 (< 576px) */
        @media (max-width: 575px) {
            .container {
                width: 100%;
                padding: 0 8px;
            }

            #video-player {
                max-height: 40vh;
            }

            .video-main-title {
                font-size: 18px;
            }
        }
        
        /* 广告样式 */
        .ad-content {
            width: 100%;
            min-height: 150px;
            background-color: #111;
            border-radius: 8px;
            overflow: hidden;
            margin-top: 10px;
        }
        
        .ad-content iframe,
        .ad-content img {
            width: 100%;
            border: none;
        }
        
        .player-ad-container {
            margin-top: 20px;
        }
            
            .video-stats {
                font-size: 13px;
                gap: 10px;
            }
        }
        
        /* 极窄屏幕 (< 400px) */
        @media (max-width: 400px) {
        }
    </style>

    <script>
        // URL参数加密和解密函数
        function encryptParam(param) {
            return btoa(encodeURIComponent(param));
        }
        
        function decryptParam(encryptedParam) {
            try {
                return decodeURIComponent(atob(encryptedParam));
            } catch (e) {
                console.error('解密参数失败:', e);
                return '';
            }
        }
        
        // 获取URL参数
        function getUrlParam(name) {
            const urlParams = new URLSearchParams(window.location.search);
            const encryptedValue = urlParams.get(name);
            if (encryptedValue) {
                return decryptParam(encryptedValue);
            }
            return null;
        }
        
        // 显示播放页
        function showPlayPage() {
            // 获取URL参数中的视频URL和标题
            const videoUrl = getUrlParam('url');
            const videoTitle = getUrlParam('title');
            const videoId = getUrlParam('id');
            const posterUrl = getUrlParam('poster');

            // 更新页面内容
            if (videoTitle) {
                document.getElementById('video-main-title').textContent = decodeURIComponent(videoTitle);
            } else {
                document.getElementById('video-main-title').textContent = '视频标题';
            }

            // 固定显示的描述
            document.getElementById('video-description').textContent = '视频描述内容将在这里显示。这是一个示例描述，实际内容会根据所选视频动态加载。';

            // 固定显示的统计数据
            document.getElementById('play-count').textContent = '125.8万';
            document.getElementById('like-count').textContent = '8.6万';
            document.getElementById('publish-date').textContent = '2025-01-15';

            // 设置视频源
            const videoPlayer = document.getElementById('video-player');

            // 设置视频缩略图
            if (posterUrl) {
                videoPlayer.poster = decodeURIComponent(posterUrl);
                console.log('设置视频缩略图:', decodeURIComponent(posterUrl));
            }

            if (videoUrl) {
                const decodedUrl = decodeURIComponent(videoUrl);
                console.log('视频URL:', decodedUrl);

                // 检查是否为m3u8格式
                if (decodedUrl.includes('.m3u8')) {
                    // 使用HLS.js播放m3u8格式视频
                    if (Hls.isSupported()) {
                        const hls = new Hls();
                        hls.loadSource(decodedUrl);
                        hls.attachMedia(videoPlayer);
                        hls.on(Hls.Events.MANIFEST_PARSED, function() {
                            console.log('视频加载成功，准备播放');
                            initializeAds();
                        });
                        hls.on(Hls.Events.ERROR, function(event, data) {
                            console.error('HLS错误:', data);
                            if (data.fatal) {
                                switch(data.type) {
                                    case Hls.ErrorTypes.NETWORK_ERROR:
                                        console.error('网络错误，尝试重新加载');
                                        hls.startLoad();
                                        break;
                                    case Hls.ErrorTypes.MEDIA_ERROR:
                                        console.error('媒体错误，尝试恢复');
                                        hls.recoverMediaError();
                                        break;
                                    default:
                                        console.error('致命错误，无法恢复');
                                        hls.destroy();
                                        break;
                                }
                            }
                        });
                    } else if (videoPlayer.canPlayType('application/vnd.apple.mpegurl')) {
                        // 浏览器原生支持HLS
                        videoPlayer.src = decodedUrl;
                        videoPlayer.load();
                        videoPlayer.addEventListener('loadedmetadata', function() {
                            initializeAds();
                        });
                    } else {
                        console.error('浏览器不支持HLS视频播放');
                    }
                } else {
                    // 普通视频格式
                    const source = videoPlayer.querySelector('source');
                    source.src = decodedUrl;
                    videoPlayer.load();
                    videoPlayer.addEventListener('loadedmetadata', function() {
                        initializeAds();
                    });
                }
            }
        }
        
        // 初始化IMA SDK和广告
        function initializeAds() {
            const videoPlayer = document.getElementById('video-player');
            const adContainer = document.getElementById('ad-container');
            
            console.log('开始初始化广告...');
            console.log('当前时间:', new Date().toLocaleString());
            
            // 如果已经存在广告管理器，先销毁
            if (window.adsManager) {
                try {
                    window.adsManager.destroy();
                    window.adsManager = null;
                    console.log('已销毁旧的广告管理器');
                } catch (e) {
                    console.error('销毁广告管理器失败:', e);
                }
            }
            
            // 如果已经存在AdsLoader，先销毁
            if (window.adsLoader) {
                try {
                    window.adsLoader.contentComplete();
                    window.adsLoader = null;
                    console.log('已清理旧的AdsLoader');
                } catch (e) {
                    console.error('清理AdsLoader失败:', e);
                }
            }
            
            // 清空广告容器
            adContainer.innerHTML = '';
            console.log('已清空广告容器');
            
            // 创建新的AdDisplayContainer
            const adDisplayContainer = new google.ima.AdDisplayContainer(adContainer, videoPlayer);
            
            // 创建新的AdsLoader
            const adsLoader = new google.ima.AdsLoader(adDisplayContainer);
            
            // 监听广告加载事件
            adsLoader.addEventListener(google.ima.AdsManagerLoadedEvent.Type.ADS_MANAGER_LOADED, onAdsManagerLoaded, false);
            adsLoader.addEventListener(google.ima.AdErrorEvent.Type.AD_ERROR, onAdError, false);
            adsLoader.addEventListener(google.ima.AdEvent.Type.AD_METADATA, onAdMetadata, false);
            
            // 创建广告请求
            const adsRequest = new google.ima.AdsRequest();
            const timestamp = new Date().getTime();
            const random = Math.floor(Math.random() * 1000000);
            const sessionId = Math.random().toString(36).substring(7);
            const adTagUrl = 'https://s.magsrv.com/v1/vast.php?idzone=5846374&ts=' + timestamp + '&r=' + random + '&sid=' + sessionId;
            
            console.log('广告请求URL:', adTagUrl);
            
            adsRequest.adTagUrl = adTagUrl;
            adsRequest.linearAdSlotWidth = videoPlayer.clientWidth;
            adsRequest.linearAdSlotHeight = videoPlayer.clientHeight;
            adsRequest.nonLinearAdSlotWidth = videoPlayer.clientWidth;
            adsRequest.nonLinearAdSlotHeight = videoPlayer.clientHeight / 3;
            adsRequest.setAdWillAutoPlay(true);
            adsRequest.setAdWillPlayMuted(false);
            
            // 初始化广告容器
            adDisplayContainer.initialize();
            console.log('广告容器已初始化');
            
            // 请求广告
            adsLoader.requestAds(adsRequest);
            console.log('已发送广告请求');
            
            // 存储全局变量
            window.adsLoader = adsLoader;
            window.adDisplayContainer = adDisplayContainer;
            window.videoPlayer = videoPlayer;
        }
        
        // 广告管理器加载完成
        function onAdsManagerLoaded(adsManagerLoadedEvent) {
            const adsManager = adsManagerLoadedEvent.getAdsManager(window.videoPlayer);
            
            // 监听广告事件
            adsManager.addEventListener(google.ima.AdEvent.Type.LOADED, onAdLoaded);
            adsManager.addEventListener(google.ima.AdEvent.Type.STARTED, onAdStarted);
            adsManager.addEventListener(google.ima.AdEvent.Type.COMPLETE, onAdComplete);
            adsManager.addEventListener(google.ima.AdEvent.Type.ALL_ADS_COMPLETED, onAllAdsComplete);
            adsManager.addEventListener(google.ima.AdErrorEvent.Type.AD_ERROR, onAdError);
            
            // 存储全局变量
            window.adsManager = adsManager;
            
            // 监听广告事件
            adsManager.addEventListener(google.ima.AdEvent.Type.PAUSED, onAdPaused);
            adsManager.addEventListener(google.ima.AdEvent.Type.RESUMED, onAdResumed);
            adsManager.addEventListener(google.ima.AdEvent.Type.CLICK, onAdClicked);
            
            // 初始化广告管理器
            try {
                adsManager.init(window.videoPlayer.clientWidth, window.videoPlayer.clientHeight, google.ima.ViewMode.NORMAL);
                adsManager.start();
            } catch (adError) {
                console.error('广告管理器初始化失败:', adError);
                // 初始化失败时，显示视频播放器控件并播放视频
                window.videoPlayer.controls = true;
                window.videoPlayer.play();
            }
        }
        
        // 广告加载完成
        function onAdLoaded(adEvent) {
            console.log('广告加载完成');
            // 确保广告加载时隐藏视频播放器控件
            window.videoPlayer.controls = false;
            // 设置广告容器允许鼠标事件
            document.getElementById('ad-container').style.pointerEvents = 'auto';
        }
        
        // 广告元数据
        function onAdMetadata(adEvent) {
            console.log('广告元数据:', adEvent);
            // 确保广告元数据加载时隐藏视频播放器控件
            window.videoPlayer.controls = false;
            // 设置广告容器允许鼠标事件
            document.getElementById('ad-container').style.pointerEvents = 'auto';
        }
        
        // 广告开始播放
        function onAdStarted(adEvent) {
            console.log('广告开始播放');
            window.videoPlayer.pause();
            window.videoPlayer.controls = false;
            // 设置广告容器允许鼠标事件
            document.getElementById('ad-container').style.pointerEvents = 'auto';
        }
        
        // 广告暂停
        function onAdPaused(adEvent) {
            console.log('广告暂停');
            // 延迟500ms后自动恢复广告播放
            setTimeout(function() {
                if (window.adsManager) {
                    try {
                        window.adsManager.resume();
                        console.log('广告自动恢复播放');
                    } catch (e) {
                        console.error('自动恢复广告播放失败:', e);
                        // 如果恢复失败，显示视频播放器控件
                        window.videoPlayer.controls = true;
                    }
                }
            }, 500);
        }
        
        // 广告恢复
        function onAdResumed(adEvent) {
            console.log('广告恢复');
            window.videoPlayer.controls = false;
        }
        
        // 广告被点击
        function onAdClicked(adEvent) {
            console.log('广告被点击');
            // 延迟500ms后自动恢复广告播放
            setTimeout(function() {
                if (window.adsManager) {
                    try {
                        window.adsManager.resume();
                        console.log('广告恢复播放');
                    } catch (e) {
                        console.error('恢复广告播放失败:', e);
                        // 如果恢复失败，显示视频播放器控件
                        window.videoPlayer.controls = true;
                    }
                }
            }, 500);
        }
        
        // 广告播放完成
        function onAdComplete(adEvent) {
            console.log('广告播放完成');
        }
        
        // 所有广告播放完成
        function onAllAdsComplete(adEvent) {
            console.log('所有广告播放完成');
            window.videoPlayer.controls = true;
            window.videoPlayer.play();
            
            // 设置广告容器不允许鼠标事件
            document.getElementById('ad-container').style.pointerEvents = 'none';
            
            // 销毁广告管理器
            if (window.adsManager) {
                try {
                    window.adsManager.destroy();
                    window.adsManager = null;
                } catch (e) {
                    console.error('销毁广告管理器失败:', e);
                }
            }
        }
        
        // 广告错误处理
        function onAdError(adErrorEvent) {
            console.error('广告错误:', adErrorEvent.getError());
            window.videoPlayer.controls = true;
            window.videoPlayer.play();
            
            // 设置广告容器不允许鼠标事件
            document.getElementById('ad-container').style.pointerEvents = 'none';
            
            // 销毁广告管理器
            if (window.adsManager) {
                try {
                    window.adsManager.destroy();
                    window.adsManager = null;
                } catch (e) {
                    console.error('销毁广告管理器失败:', e);
                }
            }
        }
        
        // 页面初始化
        document.addEventListener('DOMContentLoaded', function() {
            // 显示视频
            showPlayPage();
            
            // 添加视频播放器事件监听器
            const videoPlayer = document.getElementById('video-player');
            const videoWrapper = document.getElementById('video-wrapper');
            
            // 视频播放时确保控件可见
            videoPlayer.addEventListener('play', function() {
                console.log('视频开始播放');
                videoPlayer.controls = true;
            });
            
            // 视频暂停时确保控件可见
            videoPlayer.addEventListener('pause', function() {
                console.log('视频暂停');
                videoPlayer.controls = true;
            });
            
            // 视频结束时确保控件可见
            videoPlayer.addEventListener('ended', function() {
                console.log('视频结束');
                videoPlayer.controls = true;
            });
            
            // 视频加载时确保控件可见
            videoPlayer.addEventListener('loadedmetadata', function() {
                console.log('视频元数据加载完成');
                videoPlayer.controls = true;
            });
            
            // 视频点击时确保控件可见
            videoPlayer.addEventListener('click', function() {
                console.log('视频被点击');
                videoPlayer.controls = true;
            });
            
            // 鼠标悬停在视频上时显示控件
            videoWrapper.addEventListener('mouseenter', function() {
                console.log('鼠标悬停在视频上');
                videoPlayer.controls = true;
            });
            
            // 鼠标离开视频时隐藏控件（如果正在播放）
            videoWrapper.addEventListener('mouseleave', function() {
                console.log('鼠标离开视频');
                if (!videoPlayer.paused) {
                    videoPlayer.controls = false;
                }
            });
            
            // 鼠标在视频上移动时显示控件
            videoWrapper.addEventListener('mousemove', function() {
                console.log('鼠标在视频上移动');
                videoPlayer.controls = true;
            });
        })
    </script>

    <!-- 安全措施脚本 -->
    <script>
        // 禁止右键菜单
        document.addEventListener('contextmenu', function(e) {
            e.preventDefault();
        });
        
        // 禁止F12键
        document.addEventListener('keydown', function(e) {
            // F12键
            if (e.keyCode === 123) {
                e.preventDefault();
            }
            // Ctrl+Shift+I
            if (e.ctrlKey && e.shiftKey && e.keyCode === 73) {
                e.preventDefault();
            }
            // Ctrl+Shift+C
            if (e.ctrlKey && e.shiftKey && e.keyCode === 67) {
                e.preventDefault();
            }
            // Ctrl+Shift+J
            if (e.ctrlKey && e.shiftKey && e.keyCode === 74) {
                e.preventDefault();
            }
            // Ctrl+U
            if (e.ctrlKey && e.keyCode === 85) {
                e.preventDefault();
            }
        });
        
        // 简单的加密函数
        function encryptUrl(url) {
            return btoa(encodeURIComponent(url));
        }
        
        // 简单的解密函数
        function decryptUrl(encryptedUrl) {
            return decodeURIComponent(atob(encryptedUrl));
        }
        
        // 检测爬取行为
        function detectCrawling() {
            // 检测请求频率
            let requestCount = 0;
            setInterval(function() {
                if (requestCount > 50) {
                    requestCount = 0;
                }
            }, 1000);
            
            // 重写fetch和XMLHttpRequest
            const originalFetch = window.fetch;
            window.fetch = function() {
                requestCount++;
                return originalFetch.apply(this, arguments);
            };
            
            const originalXHR = window.XMLHttpRequest;
            window.XMLHttpRequest = function() {
                const xhr = new originalXHR();
                const originalOpen = xhr.open;
                xhr.open = function() {
                    requestCount++;
                    return originalOpen.apply(this, arguments);
                };
                return xhr;
            };
        }
        
        // 初始化安全措施
        detectCrawling();
