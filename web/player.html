    <!-- Google IMA SDK for video ads -->
    <script>
        // 跟踪IMA SDK加载状态
        window.imaSdkLoaded = false;
        console.log('开始加载IMA SDK');
        
        // 加载IMA SDK
        var imaScript = document.createElement('script');
        imaScript.src = 'https://imasdk.googleapis.com/js/sdkloader/ima3.js';

    <script>
        // URL参数加密和解密函数
        function encryptParam(param) {
            return btoa(encodeURIComponent(param));
        }
        
        function decryptParam(encryptedParam) {
            try {
                return decodeURIComponent(atob(encryptedParam));
            } catch (e) {
                console.error('解密参数失败:', e);
                return '';
            }
        }
        
        // 获取URL参数
        function getUrlParam(name) {
            const urlParams = new URLSearchParams(window.location.search);
            const encryptedValue = urlParams.get(name);
            if (encryptedValue) {
                return decryptParam(encryptedValue);
            }
            return null;
        }
        
        // 显示播放页
        function showPlayPage() {
            // 获取URL参数中的视频URL和标题
            const videoUrl = getUrlParam('url');
            const videoTitle = getUrlParam('title');
            const videoId = getUrlParam('id');
            const posterUrl = getUrlParam('poster');

            // 更新页面内容
            if (videoTitle) {
                document.getElementById('video-main-title').textContent = decodeURIComponent(videoTitle);
            } else {
                document.getElementById('video-main-title').textContent = '视频标题';
            }

            // 固定显示的描述
            document.getElementById('video-description').textContent = '';

            // 固定显示的统计数据
            document.getElementById('play-count').textContent = '125.8万';
            document.getElementById('like-count').textContent = '8.6万';
            document.getElementById('publish-date').textContent = '2025-01-15';

            // 设置视频源
            const videoPlayer = document.getElementById('video-player');

            // 设置视频缩略图
            if (posterUrl) {
                videoPlayer.poster = decodeURIComponent(posterUrl);
                console.log('设置视频缩略图:', decodeURIComponent(posterUrl));
            }

            if (videoUrl) {
                const decodedUrl = decodeURIComponent(videoUrl);
                console.log('视频URL:', decodedUrl);

                // 检查是否为m3u8格式
                if (decodedUrl.includes('.m3u8')) {
                    // 使用HLS.js播放m3u8格式视频
                    if (Hls.isSupported()) {
                        const hls = new Hls();
                        hls.loadSource(decodedUrl);
                        hls.attachMedia(videoPlayer);
                        hls.on(Hls.Events.MANIFEST_PARSED, function() {
                            console.log('视频加载成功，准备播放');
                            // 设置控件可见
                            videoPlayer.controls = true;
                            // 尝试自动播放
                            videoPlayer.play().catch(function(error) {
                                console.error('视频自动播放失败:', error);
                            });
                        });
                        hls.on(Hls.Events.ERROR, function(event, data) {
                            console.error('HLS错误:', data);
                            if (data.fatal) {
                                switch(data.type) {
                                    case Hls.ErrorTypes.NETWORK_ERROR:
                                        console.error('网络错误，尝试重新加载');
                                        hls.startLoad();
                                        break;
                                    case Hls.ErrorTypes.MEDIA_ERROR:
                                        console.error('媒体错误，尝试恢复');
                                        hls.recoverMediaError();
                                        break;
                                    default:
                                        console.error('致命错误，无法恢复');
                                        hls.destroy();
                                        break;
                                }
                            }
                        });
                    } else if (videoPlayer.canPlayType('application/vnd.apple.mpegurl')) {
                        // 浏览器原生支持HLS
                        videoPlayer.src = decodedUrl;
                        videoPlayer.load();
                        videoPlayer.controls = true;
                        // 尝试自动播放
                        videoPlayer.play().catch(function(error) {
                            console.error('视频自动播放失败:', error);
                        });
                    } else {
                        console.error('浏览器不支持HLS视频播放');
                    }
                } else {
                    // 普通视频格式
                    const source = videoPlayer.querySelector('source');
                    source.src = decodedUrl;
                    videoPlayer.load();
                    videoPlayer.controls = true;
                    // 尝试自动播放
                    videoPlayer.play().catch(function(error) {
                        console.error('视频自动播放失败:', error);
                    });
                }
            }
            
            // 确保视频控件可见
            videoPlayer.controls = true;
        }
        
        // 初始化前贴片内容
        function initPrerollAd() {
            console.log('=== 开始初始化前贴片内容 ===');
            
            // 获取视频播放器
            const videoPlayer = document.getElementById('video-player');
            
            // 检查视频播放器是否存在
            if (!videoPlayer) {
                console.error('视频播放器不存在');
                return;
            }
            
            // 检查IMA SDK是否加载且结构完整
            if (typeof google === 'undefined' || !google.ima || typeof google.ima !== 'object') {
                console.error('IMA SDK未正确加载，无法初始化内容，直接播放视频');
                console.log('google对象:', typeof google);
                console.log('google.ima:', typeof google === 'undefined' ? 'undefined' : google.ima);
                console.log('imaSdkLoaded:', window.imaSdkLoaded);
                
                // 直接播放视频
                videoPlayer.controls = true;
                videoPlayer.play().catch(function(error) {
                    console.error('视频播放失败:', error);
                });
                return;
            }
            
            // 更严格地检查AdsLoader和AdsRequest是否为函数
            if (typeof google.ima.AdsLoader !== 'function' || typeof google.ima.AdsRequest !== 'function') {
                console.error('IMA SDK结构不完整，无法初始化内容，直接播放视频');
                console.log('google.ima.AdsLoader类型:', typeof google.ima.AdsLoader);
                console.log('google.ima.AdsRequest类型:', typeof google.ima.AdsRequest);
                console.log('imaSdkLoaded:', window.imaSdkLoaded);
                
                // 直接播放视频
                videoPlayer.controls = true;
                videoPlayer.play().catch(function(error) {
                    console.error('视频播放失败:', error);
                });
                return;
            }
            
            console.log('IMA SDK已加载');
            console.log('google.ima对象:', google.ima);
            console.log('google.ima.AdsLoader:', google.ima.AdsLoader);
            console.log('google.ima.AdsRequest:', google.ima.AdsRequest);
            
            // 获取内容容器
            const adContainer = document.getElementById('ad-container');
            
            if (!adContainer) {
                console.error('内容容器不存在，直接播放视频');
                videoPlayer.controls = true;
                videoPlayer.play().catch(function(error) {
                    console.error('视频播放失败:', error);
                });
                return;
            }
            
            console.log('内容容器和视频播放器都存在');
            
            // 检查内容容器尺寸
            if (adContainer.offsetWidth === 0 || adContainer.offsetHeight === 0) {
                console.error('内容容器尺寸为0，无法初始化内容，直接播放视频');
                videoPlayer.controls = true;
                videoPlayer.play().catch(function(error) {
                    console.error('视频播放失败:', error);
                });
                return;
            }
            
            // 获取视频包装器
            const videoWrapper = document.getElementById('video-wrapper');
            console.log('视频包装器:', videoWrapper);
            
            if (!videoWrapper) {
                console.error('视频包装器不存在，直接播放视频');
                videoPlayer.controls = true;
                videoPlayer.play().catch(function(error) {
                    console.error('视频播放失败:', error);
                });
                return;
            }
            
            // 检查视频包装器尺寸
            if (videoWrapper.offsetWidth === 0 || videoWrapper.offsetHeight === 0) {
                console.error('视频包装器尺寸为0，无法初始化内容，直接播放视频');
                videoPlayer.controls = true;
                videoPlayer.play().catch(function(error) {
                    console.error('视频播放失败:', error);
                });
                return;
            }
            
            console.log('视频包装器尺寸:', videoWrapper.offsetWidth + 'x' + videoWrapper.offsetHeight);
            
            // 生成唯一参数以防止缓存
            const timestamp = Date.now();
            const random = Math.random().toString(36).substring(2);
            const sessionId = timestamp + '_' + random;
            
            // VAST内容URL
            const adTagUrl = 'https://s.magsrv.com/v1/vast.php?idzone=5846374&ts=' + timestamp + '&r=' + random + '&sid=' + sessionId + '&page_url=' + encodeURIComponent(window.location.href);
            
            console.log('初始化前贴片内容，内容URL:', adTagUrl);
            
            // 延迟创建AdsLoader，确保容器完全准备好
            setTimeout(function() {
                createAdsLoader(adContainer, videoWrapper, videoPlayer, adTagUrl);
            }, 100);
        }
        
        function createAdsLoader(adContainer, videoWrapper, videoPlayer, adTagUrl) {
            console.log('开始创建AdsLoader');
            console.log('内容容器:', adContainer);
            console.log('内容容器尺寸:', adContainer.offsetWidth + 'x' + adContainer.offsetHeight);
            
            try {
                // 启用内容容器的交互
                adContainer.style.pointerEvents = 'auto';
                console.log('启用内容容器交互');
                
                // 检查AdDisplayContainer是否存在
                if (!google.ima.AdDisplayContainer) {
                    console.error('AdDisplayContainer不存在，直接播放视频');
                    videoPlayer.controls = true;
                    videoPlayer.play().catch(function(error) {
                        console.error('视频播放失败:', error);
                    });
                    return;
                }
                
                // 创建AdDisplayContainer
                let adDisplayContainer;
                try {
                    adDisplayContainer = new google.ima.AdDisplayContainer(adContainer, videoPlayer);
                    console.log('AdDisplayContainer创建成功:', adDisplayContainer);
                } catch (containerError) {
                    console.error('创建AdDisplayContainer失败:', containerError);
                    console.error('错误堆栈:', containerError.stack);
                    
                    // 禁用内容容器的交互
                    adContainer.style.pointerEvents = 'none';
                    console.log('禁用内容容器交互');
                    
                    // 直接播放视频
                    videoPlayer.controls = true;
                    videoPlayer.play().catch(function(error) {
                        console.error('视频播放失败:', error);
                    });
                    return;
                }
                
                // 尝试创建AdsLoader
                let adsLoader;
                try {
                    adsLoader = new google.ima.AdsLoader(adDisplayContainer);
                    console.log('AdsLoader创建成功:', adsLoader);
                } catch (loaderError) {
                    console.error('创建AdsLoader失败:', loaderError);
                    console.error('错误堆栈:', loaderError.stack);
                    
                    // 禁用内容容器的交互
                    adContainer.style.pointerEvents = 'none';
                    console.log('禁用内容容器交互');
                    
                    // 直接播放视频
                    videoPlayer.controls = true;
                    videoPlayer.play().catch(function(error) {
                        console.error('视频播放失败:', error);
                    });
                    return;
                }
                
                // 检查必要的事件类型是否存在
                if (!google.ima.AdsManagerLoadedEvent || !google.ima.AdErrorEvent) {
                    console.error('IMA SDK事件类型不存在，直接播放视频');
                    
                    // 禁用内容容器的交互
                    adContainer.style.pointerEvents = 'none';
                    console.log('禁用内容容器交互');
                    
                    // 直接播放视频
                    videoPlayer.controls = true;
                    videoPlayer.play().catch(function(error) {
                        console.error('视频播放失败:', error);
                    });
                    return;
                }
                
                const adsManagerLoadedEvent = google.ima.AdsManagerLoadedEvent;
                const adErrorEvent = google.ima.AdErrorEvent;
                
                console.log('开始设置内容事件监听器');
                
                // 监听内容加载完成事件
                adsLoader.addEventListener(adsManagerLoadedEvent.Type.ADS_MANAGER_LOADED, function(adsManagerLoadedEvent) {
                    console.log('内容管理器加载完成');
                    
                    try {
                        // 检查AdsRenderingSettings是否存在
                        if (!google.ima.AdsRenderingSettings) {
                            console.error('AdsRenderingSettings不存在，直接播放视频');
                            
                            // 禁用内容容器的交互
                            adContainer.style.pointerEvents = 'none';
                            console.log('禁用内容容器交互');
                            
                            // 直接播放视频
                            videoPlayer.controls = true;
                            videoPlayer.play().catch(function(error) {
                                console.error('视频播放失败:', error);
                            });
                            return;
                        }
                        
                        const adsRenderingSettings = new google.ima.AdsRenderingSettings();
                        adsRenderingSettings.restoreCustomPlaybackStateOnAdBreakComplete = true;
                        
                        // 尝试获取AdsManager
                        let adsManager;
                        try {
                            adsManager = adsManagerLoadedEvent.getAdsManager(videoPlayer, adsRenderingSettings);
                        } catch (managerError) {
                            console.error('获取AdsManager失败:', managerError);
                            
                            // 禁用内容容器的交互
                            adContainer.style.pointerEvents = 'none';
                            console.log('禁用内容容器交互');
                            
                            // 直接播放视频
                            videoPlayer.controls = true;
                            videoPlayer.play().catch(function(error) {
                                console.error('视频播放失败:', error);
                            });
                            return;
                        }
                        
                        // 监听内容事件
                        adsManager.addEventListener(google.ima.AdErrorEvent.Type.AD_ERROR, function(adErrorEvent) {

        // 检查并修复关闭按钮的辅助函数
        function checkAndFixCloseButtons(container, source) {
            // 查找所有可能的关闭按钮
            const closeButtons = container.querySelectorAll('button, .close, .close-btn, .close-button, [class*="close"], [title*="close"], [aria-label*="close"]');
            console.log(source + '中的按钮数量:', closeButtons.length);
            
            closeButtons.forEach(function(btn, btnIndex) {
                const btnText = btn.textContent.toLowerCase();
                const btnTitle = (btn.getAttribute('title') || '').toLowerCase();
                const btnAriaLabel = (btn.getAttribute('aria-label') || '').toLowerCase();
                const btnClass = (btn.className || '').toLowerCase();
                
                console.log(source + '按钮', btnIndex, '- 文本:', btnText, ', title:', btnTitle, ', aria-label:', btnAriaLabel, ', class:', btnClass);
                
                // 检查是否为关闭按钮
                if (btnText.includes('close') || btnTitle.includes('close') || btnAriaLabel.includes('close') ||
                    btnText.includes('关闭') || btnTitle.includes('关闭') || btnAriaLabel.includes('关闭') ||
                    btnText.includes('✕') || btnText.includes('×') || btnText.includes('×') ||
                    btnClass.includes('close') || btnClass.includes('关闭')) {
                    console.log('找到关闭按钮，修复显示');
                    // 修复关闭按钮显示
                    btn.style.display = 'block !important';
                    btn.style.visibility = 'visible !important';
                    btn.style.opacity = '1 !important';
                    btn.style.position = 'absolute !important';
                    btn.style.top = '5px !important';
                    btn.style.right = '5px !important';
                    btn.style.width = 'auto !important';
                    btn.style.height = 'auto !important';
                    btn.style.minWidth = '80px !important';
                    btn.style.minHeight = '25px !important';
                    btn.style.padding = '5px 10px !important';
                    btn.style.backgroundColor = '#ff5f00 !important';
                    btn.style.color = '#fff !important';
                    btn.style.border = 'none !important';
                    btn.style.borderRadius = '3px !important';
                    btn.style.fontSize = '12px !important';
                    btn.style.fontWeight = 'bold !important';
                    btn.style.cursor = 'pointer !important';
                    btn.style.zIndex = '9999 !important';
                    btn.style.textAlign = 'center !important';
                    btn.style.lineHeight = '1.5 !important';
                    
                    if (!btn.textContent || btn.textContent.trim() === '') {
                        btn.textContent = 'Close';
                    }
                }
            });
        }
        
        // 等待视频加载完成后初始化内容
        function waitForVideoAndInitAd() {
            const videoPlayer = document.getElementById('video-player');
            
            if (videoPlayer.readyState >= 1) {
                console.log('视频已加载，开始初始化内容');
                // 确保视频控件可见
                videoPlayer.controls = true;
                // 初始化前贴片内容
                initPrerollAd();
            } else {
                console.log('等待视频加载...');
                // 等待视频加载
                videoPlayer.addEventListener('loadedmetadata', function onMetadataLoaded() {
                    console.log('视频元数据加载完成');
                    videoPlayer.removeEventListener('loadedmetadata', onMetadataLoaded);
                    // 确保视频控件可见
                    videoPlayer.controls = true;
                    // 初始化前贴片内容
                    initPrerollAd();
                }, { once: true });
                
                // 设置超时，如果视频加载超时，直接初始化内容
                setTimeout(function() {
                    if (videoPlayer.readyState >= 1) {
                        console.log('视频加载超时检查：视频已加载');
                        videoPlayer.controls = true;
                        initPrerollAd();
                    } else {
                        console.log('视频加载超时，直接初始化内容');
                        videoPlayer.controls = true;
                        initPrerollAd();
                    }
                }, 3000);
            }
        }

            setTimeout(function() {
                console.log('开始等待视频加载以初始化内容');
                waitForVideoAndInitAd();

            // 监听URL变化，当切换视频时重新加载视频
            window.addEventListener('popstate', function() {
                console.log('URL发生变化，重新加载视频');

                }, 500);
            });
            
            // 视频播放时确保控件可见
            videoPlayer.addEventListener('play', function() {
                console.log('视频开始播放');
                videoPlayer.controls = true;
            });
            
            // 视频暂停时确保控件可见
            videoPlayer.addEventListener('pause', function() {
                console.log('视频暂停');
                videoPlayer.controls = true;
            });
            
            // 视频结束时确保控件可见
            videoPlayer.addEventListener('ended', function() {
                console.log('视频结束');
                videoPlayer.controls = true;
            });
            
            // 视频加载时确保控件可见
            videoPlayer.addEventListener('loadedmetadata', function() {
                console.log('视频元数据加载完成');
                videoPlayer.controls = true;
            });
            
            // 视频点击时确保控件可见
            videoPlayer.addEventListener('click', function() {
                console.log('视频被点击');
                videoPlayer.controls = true;
            });
            
            // 鼠标悬停在视频上时显示控件
            videoWrapper.addEventListener('mouseenter', function() {
                console.log('鼠标悬停在视频上');
                videoPlayer.controls = true;
            });
            
            // 鼠标离开视频时隐藏控件（如果正在播放）
            videoWrapper.addEventListener('mouseleave', function() {
                console.log('鼠标离开视频');
                if (!videoPlayer.paused) {
                    videoPlayer.controls = false;
                }
            });
            
            // 鼠标在视频上移动时显示控件
            videoWrapper.addEventListener('mousemove', function() {
                console.log('鼠标在视频上移动');
                videoPlayer.controls = true;
            });
        });
    </script>

    <!-- 安全措施脚本 -->
    <script>
        // 禁止右键菜单
        document.addEventListener('contextmenu', function(e) {
            e.preventDefault();
        });
        
        // 禁止F12键
        document.addEventListener('keydown', function(e) {
            // F12键
            if (e.keyCode === 123) {
                e.preventDefault();
            }
            // Ctrl+Shift+I
            if (e.ctrlKey && e.shiftKey && e.keyCode === 73) {
                e.preventDefault();
            }
            // Ctrl+Shift+C
            if (e.ctrlKey && e.shiftKey && e.keyCode === 67) {
                e.preventDefault();
            }
            // Ctrl+Shift+J
            if (e.ctrlKey && e.shiftKey && e.keyCode === 74) {
                e.preventDefault();
            }
            // Ctrl+U
            if (e.ctrlKey && e.keyCode === 85) {
                e.preventDefault();
            }
        });
        
        // 简单的加密函数
        function encryptUrl(url) {
            return btoa(encodeURIComponent(url));
        }
        
        // 简单的解密函数
        function decryptUrl(encryptedUrl) {
            return decodeURIComponent(atob(encryptedUrl));
        }
        
        // 检测爬取行为
        function detectCrawling() {
            // 检测请求频率
            let requestCount = 0;
            setInterval(function() {
                if (requestCount > 50) {
                    requestCount = 0;
                }
            }, 1000);
            
            // 重写fetch和XMLHttpRequest
            const originalFetch = window.fetch;
            window.fetch = function() {
                requestCount++;
                return originalFetch.apply(this, arguments);
            };
            
            const originalXHR = window.XMLHttpRequest;
            window.XMLHttpRequest = function() {
                const xhr = new originalXHR();
                const originalOpen = xhr.open;
                xhr.open = function() {
                    requestCount++;
                    return originalOpen.apply(this, arguments);
                };
                return xhr;
            };
        }
        
        // 初始化安全措施
        detectCrawling();
    </script>
