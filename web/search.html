<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>搜索结果 - 有人有鸟</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
        }
        
        html, body {
            width: 100%;
            overflow-x: hidden;
        }
        
        body {
            background-color: #000;
            color: #fff;
            line-height: 1.6;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        
        a {
            text-decoration: none;
            color: inherit;
        }
        
        .container {
            width: 100%;
            max-width: 1440px;
            margin: 0 auto;
            padding: 0 15px;
        }
        
        .search-container {
            padding: 20px 0;
            background-color: #111;
            margin-bottom: 20px;
        }
        
        .search-title {
            font-size: 20px;
            font-weight: bold;
            color: #ff5f00;
            margin-bottom: 15px;
            text-align: center;
        }
        
        .search-keyword {
            font-size: 14px;
            color: #888;
            text-align: center;
            margin-bottom: 20px;
        }
        
        .no-results {
            text-align: center;
            padding: 40px;
            color: #888;
            font-size: 16px;
        }
        
        .loading {
            text-align: center;
            padding: 40px;
            color: #888;
            font-size: 16px;
        }
        
        .channel-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 20px;
            margin-bottom: 35px;
            width: 100%;
        }
        
        .video-item {
            background-color: #181818;
            border-radius: 8px;
            overflow: hidden;
            transition: transform 0.3s, box-shadow 0.3s;
            cursor: pointer;
        }
        
        .video-item:hover {
            transform: translateY(-5px);
            box-shadow: 0 5px 15px rgba(255, 95, 0, 0.2);
        }
        
        .video-thumb-container {
            width: 100%;
            height: 0;
            padding-bottom: 56.25%;
            position: relative;
            overflow: hidden;
        }
        
        .video-thumb {
            width: 100%;
            height: 100%;
            object-fit: cover;
            position: absolute;
            top: 0;
            left: 0;
        }
        
        .video-info {
            padding: 12px;
        }
        
        .video-title {
            font-size: 14px;
            margin-bottom: 4px;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            line-height: 1.4;
        }
        
        .video-meta {
            display: flex;
            justify-content: space-between;
            color: #aaa;
            font-size: 11px;
            margin-top: 8px;
        }
        
        .pagination {
            display: flex;
            justify-content: center;
            gap: 8px;
            margin: 35px 0;
            flex-wrap: wrap;
            width: 100%;
        }
        
        .page-btn {
            width: 36px;
            height: 36px;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: #222;
            border-radius: 6px;
            cursor: pointer;
            transition: background-color 0.3s;
            font-size: 14px;
        }
        
        .page-btn:hover, .page-btn.active {
            background-color: #ff5f00;
        }
        
        @media (max-width: 1200px) {
            .channel-grid {
                grid-template-columns: repeat(4, 1fr);
            }
        }
        
        @media (max-width: 992px) {
            .channel-grid {
                grid-template-columns: repeat(3, 1fr);
            }
        }
        
        @media (max-width: 768px) {
            .channel-grid {
                grid-template-columns: repeat(2, 1fr);
                gap: 12px;
            }
            
            .video-title {
                font-size: 12px;
            }
            
            .search-title {
                font-size: 18px;
            }
        }
        
        @media (max-width: 480px) {
            .channel-grid {
                grid-template-columns: repeat(2, 1fr);
                gap: 8px;
            }
            
            .video-info {
                padding: 8px;
            }
            
            .video-title {
                font-size: 11px;
            }
        }
    </style>
</head>
<body>
    <div id="header-placeholder"></div>
    
    <div class="container">
        <div class="search-container">
            <div class="search-title">搜索结果</div>
            <div class="search-keyword" id="search-keyword"></div>
        </div>
        
        <div id="search-results">
            <div class="loading">加载中...</div>
        </div>
    </div>
    
    <div id="footer-placeholder"></div>
    
    <script>
        let allSearchResults = [];
        let currentPage = 1;
        const itemsPerPage = 20;
        
        const urlParams = new URLSearchParams(window.location.search);
        const keyword = urlParams.get('keyword');
        const pageParam = urlParams.get('page');
        
        if (pageParam) {
            currentPage = parseInt(pageParam);
        }
        
        const searchKeywordElement = document.getElementById('search-keyword');
        if (keyword) {
            searchKeywordElement.textContent = '搜索关键词: "' + decodeURIComponent(keyword) + '"';
        } else {
            searchKeywordElement.textContent = '请输入搜索关键词';
        }
        
        fetch('header.html')
            .then(response => response.text())
            .then(html => {
                document.getElementById('header-placeholder').innerHTML = html;
            });
        
        fetch('footer.html')
            .then(response => response.text())
            .then(html => {
                document.getElementById('footer-placeholder').innerHTML = html;
            });
        
        if (keyword) {
            searchVideos(decodeURIComponent(keyword));
        } else {
            document.getElementById('search-results').innerHTML = '<div class="no-results">请输入搜索关键词</div>';
        }
        
        function searchVideos(keyword) {
            const searchResultsElement = document.getElementById('search-results');
            searchResultsElement.innerHTML = '<div class="loading">搜索中...</div>';
            
            const jsonFiles = [
                'home_data.json',
                'rmtj.json',
                'hrzq.json',
                'avjs.json',
                'aimx.json',
                'zwzm.json',
                'wbhl.json',
                'rbwm.json',
                'gczq.json',
                'rbtj.json',
                'rbym.json',
                'omzq.json',
                'xgrq.json',
                'yqzl.json',
                'zjgx.json',
                'mtqt.json',
                'mgxl.json',
                'rqsn.json',
                'cjjq.json'
            ];
            
            const promises = jsonFiles.map(file => {
                return fetch('assets/' + file)
                    .then(response => {
                        if (!response.ok) {
                            return null;
                        }
                        return response.json();
                    })
                    .catch(error => {
                        console.error('加载' + file + '失败:', error);
                        return null;
                    });
            });
            
            Promise.all(promises)
                .then(dataArray => {
                    allSearchResults = [];
                    dataArray.forEach(data => {
                        if (data) {
                            const results = searchInData(data, keyword);
                            allSearchResults.push(...results);
                        }
                    });
                    
                    displaySearchResults(allSearchResults);
                })
                .catch(error => {
                    console.error('搜索失败:', error);
                    searchResultsElement.innerHTML = '<div class="no-results">搜索失败，请稍后重试</div>';
                });
        }
        
        function searchInData(data, keyword) {
            const results = [];
            const lowerKeyword = keyword.toLowerCase();
            
            if (data.sections && Array.isArray(data.sections)) {
                data.sections.forEach(section => {
                    if (section.movies && Array.isArray(section.movies)) {
                        section.movies.forEach(movie => {
                            if (movie.title && movie.title.toLowerCase().includes(lowerKeyword)) {
                                results.push(movie);
                            }
                        });
                    }
                });
            }
            
            if (data.items && Array.isArray(data.items)) {
                data.items.forEach(movie => {
                    if (movie.title && movie.title.toLowerCase().includes(lowerKeyword)) {
                        results.push(movie);
                    }
                });
            }
            
            if (data.movies && Array.isArray(data.movies)) {
                data.movies.forEach(movie => {
                    if (movie.title && movie.title.toLowerCase().includes(lowerKeyword)) {
                        results.push(movie);
                    }
                });
            }
            
            if (data.banner_slides && Array.isArray(data.banner_slides)) {
                data.banner_slides.forEach(movie => {
                    if (movie.title && movie.title.toLowerCase().includes(lowerKeyword)) {
                        results.push(movie);
                    }
                });
            }
            
            return results;
        }
        
        function displaySearchResults(results) {
            const searchResultsElement = document.getElementById('search-results');
            
            if (results.length === 0) {
                searchResultsElement.innerHTML = '<div class="no-results">未找到相关视频</div>';
                return;
            }
            
            const totalPages = Math.ceil(results.length / itemsPerPage);
            const startIndex = (currentPage - 1) * itemsPerPage;
            const endIndex = startIndex + itemsPerPage;
            const pageResults = results.slice(startIndex, endIndex);
            
            let moviesHTML = '';
            pageResults.forEach(movie => {
                moviesHTML += '<div class="video-item" onclick="openPlayer(' + JSON.stringify(movie).replace(/"/g, '&quot;') + ')"><div class="video-thumb-container"><img class="video-thumb" src="' + movie.poster + '" alt="' + movie.title + '" loading="lazy"></div><div class="video-info"><div class="video-title">' + movie.title + '</div></div></div>';
            });
            
            searchResultsElement.innerHTML = '<div class="channel-grid">' + moviesHTML + '</div><div class="pagination" id="pagination"></div>';
            
            generatePagination(currentPage, totalPages);
        }
        
        function generatePagination(currentPage, totalPages) {
            const pagination = document.getElementById('pagination');
            pagination.innerHTML = '';
            
            if (totalPages <= 1) {
                return;
            }
            
            if (currentPage > 1) {
                const prevBtn = document.createElement('div');
                prevBtn.className = 'page-btn';
                prevBtn.innerHTML = '<i class="fas fa-chevron-left"></i>';
                prevBtn.addEventListener('click', () => {
                    changePage(currentPage - 1);
                });
                pagination.appendChild(prevBtn);
            }
            
            let startPage, endPage;
            
            if (totalPages <= 5) {
                startPage = 1;
                endPage = totalPages;
            } else {
                if (currentPage <= 3) {
                    startPage = 1;
                    endPage = 5;
                } else if (currentPage >= totalPages - 2) {
                    startPage = totalPages - 4;
                    endPage = totalPages;
                } else {
                    startPage = currentPage - 2;
                    endPage = currentPage + 2;
                }
            }
            
            for (let i = startPage; i <= endPage; i++) {
                const pageBtn = document.createElement('div');
                pageBtn.className = `page-btn ${i === currentPage ? 'active' : ''}`;
                pageBtn.textContent = i;
                pageBtn.addEventListener('click', () => {
                    if (i !== currentPage) {
                        changePage(i);
                    }
                });
                pagination.appendChild(pageBtn);
            }
            
            if (currentPage < totalPages) {
                const nextBtn = document.createElement('div');
                nextBtn.className = 'page-btn';
                nextBtn.innerHTML = '<i class="fas fa-chevron-right"></i>';
                nextBtn.addEventListener('click', () => {
                    changePage(currentPage + 1);
                });
                pagination.appendChild(nextBtn);
            }
        }
        
        function changePage(page) {
            currentPage = page;
            window.scrollTo(0, 0);
            displaySearchResults(allSearchResults);
        }
        
        function openPlayer(movie) {
            const params = new URLSearchParams();
            params.append('id', encryptParam(movie.id || ''));
            params.append('title', encryptParam(movie.title || ''));
            params.append('type', encryptParam(movie.type || ''));
            params.append('poster', encryptParam(movie.poster || ''));
            params.append('url', encryptParam(movie.video_url || ''));
            
            window.location.href = 'player.html?' + params.toString();
        }
        
        function openChannel(channelId, channelName) {
            const params = new URLSearchParams();
            params.append('channel_id', channelId);
            params.append('channel_name', channelName);
            
            window.location.href = 'channel.html?' + params.toString();
        }
        
        function encryptParam(param) {
            return btoa(encodeURIComponent(param));
        }
        
        window.handleSearch = function(event) {
            if (event.key === 'Enter') {
                window.performSearch();
            }
        };
        
        window.performSearch = function() {
            const searchInput = document.getElementById('search-input');
            
            if (!searchInput) {
                console.error('找不到search-input元素');
                return;
            }
            
            const keyword = searchInput.value.trim();
            
            if (keyword) {
                window.location.href = 'search.html?keyword=' + encodeURIComponent(keyword);
            }
        };
    </script>
</body>
</html>
