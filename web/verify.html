<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>安全验证</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #1a1a1a 0%, #2d2d2d 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
        }
        
        .verification-container {
            text-align: center;
            padding: 40px;
            background-color: rgba(255, 255, 255, 0.05);
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            max-width: 400px;
            width: 90%;
        }
        
        .shield-icon {
            width: 80px;
            height: 80px;
            margin: 0 auto 20px;
            background: linear-gradient(135deg, #ff5f00, #ff8c00);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            animation: pulse 2s ease-in-out infinite;
        }
        
        .shield-icon i {
            font-size: 40px;
            color: #fff;
        }
        
        @keyframes pulse {
            0%, 100% {
                transform: scale(1);
                box-shadow: 0 0 0 0 rgba(255, 95, 0, 0.4);
            }
            50% {
                transform: scale(1.05);
                box-shadow: 0 0 0 20px rgba(255, 95, 0, 0);
            }
        }
        
        .verification-title {
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 10px;
            color: #fff;
        }
        
        .verification-status {
            font-size: 16px;
            color: #aaa;
            margin-bottom: 30px;
        }
        
        .loading-dots {
            display: inline-block;
        }
        
        .loading-dots span {
            animation: blink 1.4s infinite both;
            font-size: 16px;
        }
        
        .loading-dots span:nth-child(2) {
            animation-delay: 0.2s;
        }
        
        .loading-dots span:nth-child(3) {
            animation-delay: 0.4s;
        }
        
        @keyframes blink {
            0%, 80%, 100% {
                opacity: 0;
            }
            40% {
                opacity: 1;
            }
        }
        
        .enter-btn {
            background: linear-gradient(135deg, #ff5f00, #ff8c00);
            color: #fff;
            border: none;
            padding: 14px 40px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 25px;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
            min-width: 200px;
        }
        
        .enter-btn:hover {
            background: linear-gradient(135deg, #e55a00, #e57c00);
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(255, 95, 0, 0.4);
        }
        
        .enter-btn:active {
            transform: translateY(0);
        }
        
        .enter-btn:disabled {
            background: #555;
            cursor: not-allowed;
            transform: none;
        }
        
        .countdown {
            font-size: 14px;
            color: #aaa;
            margin-top: 20px;
        }
        
        .countdown span {
            color: #ff5f00;
            font-weight: bold;
            font-size: 18px;
        }
        
        .progress-bar {
            width: 100%;
            height: 4px;
            background-color: rgba(255, 255, 255, 0.1);
            border-radius: 2px;
            margin-top: 20px;
            overflow: hidden;
        }
        
        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #ff5f00, #ff8c00);
            width: 0%;
            transition: width 1s linear;
            border-radius: 2px;
        }
    </style>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="verification-container">
        <div class="shield-icon">
            <i class="fas fa-shield-alt"></i>
        </div>
        
        <h1 class="verification-title">安全验证中</h1>
        
        <p class="verification-status">
            正在进行安全检查<span class="loading-dots"><span>.</span><span>.</span><span>.</span></span>
        </p>
        
        <button id="enter-btn" class="enter-btn" disabled>
            立即进入 (3秒)
        </button>
        
        <div class="countdown">
            <span id="countdown">3</span> 秒后自动进入
        </div>
        
        <div class="progress-bar">
            <div id="progress-fill" class="progress-fill"></div>
        </div>
    </div>
    
    <script>
        let countdown = 3;
        let countdownInterval;
        let canEnter = false;
        const enterBtn = document.getElementById('enter-btn');
        const countdownElement = document.getElementById('countdown');
        const progressFill = document.getElementById('progress-fill');
        
        function startCountdown() {
            countdownInterval = setInterval(function() {
                countdown--;
                countdownElement.textContent = countdown;
                progressFill.style.width = ((3 - countdown) / 3 * 100) + '%';
                
                if (countdown <= 0) {
                    clearInterval(countdownInterval);
                    enableButton();
                }
            }, 1000);
        }
        
        function enableButton() {
            canEnter = true;
            enterBtn.disabled = false;
            enterBtn.textContent = '立即进入';
            
            // 添加点击事件监听器
            enterBtn.addEventListener('click', function() {
                if (canEnter) {
                    enterSite();
                }
            });
            
            // 自动跳转
            setTimeout(function() {
                enterSite();
            }, 500);
        }
        
        function enterSite() {
            if (!canEnter) return;
            
            clearInterval(countdownInterval);
            enterBtn.textContent = '正在跳转...';
            enterBtn.disabled = true;
            
            // 跳转到首页
            window.location.href = 'index.html';
        }
        
        // 页面加载后开始倒计时
        window.addEventListener('load', function() {
            progressFill.style.width = '0%';
            setTimeout(function() {
                startCountdown();
            }, 500);
        });
    </script>
</body>
</html>
