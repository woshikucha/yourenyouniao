<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>有人有鸟-每日更新永久免费</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* 基础样式重置 - 确保无横向滚动条 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
        }
        
        html, body {
            width: 100%;
            overflow-x: hidden; /* 防止横向滚动 */
        }
        
        body {
            background-color: #000;
            color: #fff;
            line-height: 1.6;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        
        a {
            text-decoration: none;
            color: inherit;
        }
        
        ul, ol {
            list-style: none;
        }
        
        .container {
            width: 100%;
            max-width: 1440px;
            margin: 0 auto;
            padding: 0 15px;
        }
        
        /* 头部导航样式 */
        header {
            background-color: rgba(0, 0, 0, 0.95);
            border-bottom: 1px solid #333;
            position: sticky;
            top: 0;
            z-index: 1000;
            backdrop-filter: blur(10px);
            width: 100%;
        }
        
        .header-content {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 0;
            flex-wrap: wrap;
        }
        
        .logo {
            display: flex;
            align-items: center;
            font-size: 24px;
            font-weight: bold;
            color: #ff5f00;
            margin-right: 20px;
        }
        
        .logo i {
            margin-right: 8px;
        }
        
        .nav-container {
            display: flex;
            align-items: center;
            flex: 1;
            justify-content: space-between;
            flex-wrap: wrap;
        }
        
        .nav-links {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
        }
        
        .nav-links a {
            font-size: 15px;
            padding: 6px 0;
            position: relative;
            transition: color 0.3s;
            white-space: nowrap;
        }
        
        .nav-links a:hover, .nav-links a.active {
            color: #ff5f00;
        }
        
        .nav-links a.active::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 2px;
            background-color: #ff5f00;
        }
        
        .user-actions {
            display: flex;
            align-items: center;
            gap: 15px;
            flex-shrink: 0;
        }
        
        .search-box {
            display: flex;
            align-items: center;
            background-color: #222;
            border-radius: 20px;
            padding: 6px 12px;
            min-width: 0;
        }
        
        .search-box input {
            background: transparent;
            border: none;
            color: #fff;
            padding: 0 8px;
            width: 100%;
            min-width: 0;
            max-width: 180px;
            outline: none;
            font-size: 14px;
        }
        
        .search-box button {
            background: transparent;
            border: none;
            color: #aaa;
            cursor: pointer;
            flex-shrink: 0;
        }
        
        .user-avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background-color: #444;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            flex-shrink: 0;
        }
        
        /* PC端布局 */
        .main-content {
            padding: 25px 0;
            width: 100%;
        }
        
        .content-area {
            width: 100%;
        }
        
        /* 轮播图样式 - 3:2比例 */
        .carousel {
            width: 100%;
            height: 0;
            padding-bottom: 56.25%; /* 16:9比例，更常见 */
            border-radius: 10px;
            overflow: hidden;
            position: relative;
            margin-bottom: 25px;
            background-color: #111;
        }
        
        .carousel-slide {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
            opacity: 0;
            transition: opacity 1s;
            background-size: cover;
            background-position: center;
        }
        
        .carousel-slide.active {
            opacity: 1;
        }
        
        .slide-content {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            padding: 20px;
            background: linear-gradient(to top, rgba(0,0,0,0.9), transparent);
        }
        
        .slide-title {
            font-size: 22px;
            margin-bottom: 8px;
        }
        
        .slide-desc {
            color: #ccc;
            max-width: 70%;
            font-size: 14px;
        }
        
        .carousel-controls {
            position: absolute;
            bottom: 15px;
            right: 15px;
            display: flex;
            gap: 8px;
        }
        
        .carousel-btn {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background-color: rgba(255, 255, 255, 0.5);
            cursor: pointer;
            transition: background-color 0.3s;
        }
        
        .carousel-btn.active {
            background-color: #ff5f00;
        }
        
        /* 跑马灯通知 */
        .marquee-container {
            background-color: #111;
            border-radius: 8px;
            padding: 12px;
            margin-bottom: 25px;
            display: flex;
            align-items: center;
            flex-wrap: wrap;
        }
        
        .marquee-label {
            background-color: #ff5f00;
            color: #000;
            padding: 4px 10px;
            border-radius: 4px;
            font-weight: bold;
            margin-right: 12px;
            white-space: nowrap;
            font-size: 13px;
        }
        
        .marquee-text {
            overflow: hidden;
            white-space: nowrap;
            flex: 1;
            min-width: 0;
        }
        
        .marquee-content {
            display: inline-block;
            animation: marquee 25s linear infinite;
            padding-left: 100%;
            font-size: 14px;
        }
        
        @keyframes marquee {
            0% {
                transform: translateX(0);
            }
            100% {
                transform: translateX(-100%);
            }
        }
        
        /* 推荐模块样式 - 响应式网格 */
        .recommend-section {
            margin-bottom: 35px;
        }
        
        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }
        
        .section-title {
            font-size: 20px;
            font-weight: bold;
        }
        
        .section-more {
            color: #aaa;
            font-size: 13px;
            transition: color 0.3s;
            white-space: nowrap;
        }
        
        .section-more:hover {
            color: #ff5f00;
        }
        
        .video-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 15px;
        }
        
        .video-item {
            background-color: #181818;
            border-radius: 8px;
            overflow: hidden;
            transition: transform 0.3s, box-shadow 0.3s;
        }
        
        .video-item:hover {
            transform: translateY(-5px);
            box-shadow: 0 5px 15px rgba(255, 95, 0, 0.2);
        }
        
        /* 视频缩略图保持3:2比例 */
        .video-thumb-container {
            width: 100%;
            height: 0;
            padding-bottom: 56.25%; /* 16:9比例 */
            position: relative;
            overflow: hidden;
        }
        
        .video-thumb {
            width: 100%;
            height: 100%;
            object-fit: cover;
            position: absolute;
            top: 0;
            left: 0;
        }
        
        .video-info {
            padding: 12px;
        }
        
        .video-title {
            font-size: 14px;
            margin-bottom: 4px;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            line-height: 1.4;
        }
        
        .video-meta {
            display: flex;
            justify-content: space-between;
            color: #aaa;
            font-size: 11px;
            margin-top: 8px;
        }
        
        /* 页脚样式 */
        footer {
            background-color: #111;
            padding: 40px 0 15px;
            margin-top: auto;
            width: 100%;
        }
        
        /* 广告样式 */
        .ad-content {
            width: 100%;
            min-height: 150px;
            background-color: #111;
            border-radius: 8px;
            overflow: hidden;
            margin-top: 10px;
        }
        
        .ad-content iframe,
        .ad-content img {
            width: 100%;
            border: none;
        }
        
        .footer-content {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 30px;
            margin-bottom: 30px;
        }
        
        .footer-section h3 {
            font-size: 16px;
            margin-bottom: 15px;
            color: #ff5f00;
        }
        
        .footer-links {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        
        .footer-links a {
            color: #aaa;
            transition: color 0.3s;
            font-size: 13px;
        }
        
        .footer-links a:hover {
            color: #ff5f00;
        }
        
        .copyright {
            text-align: center;
            color: #666;
            padding-top: 15px;
            border-top: 1px solid #333;
            font-size: 12px;
        }
        
        /* =============== 响应式设计 =============== */
        /* 超大屏幕 (> 1600px) */
        @media (min-width: 1601px) {
            .container {
                max-width: 1600px;
            }
        }
        
        /* 大屏幕 (1200px - 1600px) */
        @media (min-width: 1200px) and (max-width: 1600px) {
            .container {
                max-width: 1200px;
            }
            
            .video-grid {
                grid-template-columns: repeat(4, 1fr);
            }
        }
        
        /* 中等屏幕 (992px - 1199px) */
        @media (min-width: 992px) and (max-width: 1199px) {
            .container {
                max-width: 992px;
            }
            
            .video-grid {
                grid-template-columns: repeat(4, 1fr);
            }
            
            .nav-links {
                gap: 15px;
            }
            
            .sidebar {
                width: 160px;
            }
        }
        
        /* 小屏幕 (768px - 991px) */
        @media (min-width: 768px) and (max-width: 991px) {
            .container {
                max-width: 768px;
                padding: 0 12px;
            }
            
            .main-content {
                flex-direction: column;
                gap: 20px;
            }
            
            .sidebar {
                width: 100%;
                order: 2;
            }
            
            .sidebar-menu {
                flex-direction: row;
                overflow-x: auto;
                padding-bottom: 10px;
                flex-wrap: nowrap;
            }
            
            .sidebar-menu a {
                white-space: nowrap;
            }
            
            .video-grid {
                grid-template-columns: repeat(2, 1fr);
            }
            
            .footer-content {
                grid-template-columns: repeat(2, 1fr);
            }
            
            .header-content {
                flex-direction: column;
                align-items: flex-start;
                gap: 12px;
            }
            
            .nav-container {
                width: 100%;
                justify-content: space-between;
            }
            
            .nav-links {
                width: 100%;
                justify-content: flex-start;
                overflow-x: auto;
                padding-bottom: 8px;
            }
            
            .user-actions {
                margin-top: 10px;
                width: 100%;
                justify-content: flex-end;
            }
        }
        
        /* 移动端 (576px - 767px) */
        @media (min-width: 576px) and (max-width: 767px) {
            .container {
                max-width: 576px;
                padding: 0 10px;
            }
            
            .main-content {
                flex-direction: column;
                gap: 15px;
            }
            
            .sidebar {
                width: 100%;
                order: 2;
            }
            
            .sidebar-menu {
                flex-direction: row;
                overflow-x: auto;
                padding-bottom: 10px;
                flex-wrap: nowrap;
            }
            
            .video-grid {
                grid-template-columns: repeat(2, 1fr);
            }
            
            .footer-content {
                grid-template-columns: repeat(2, 1fr);
                gap: 20px;
            }
            
            .header-content {
                flex-direction: column;
                align-items: flex-start;
                gap: 10px;
            }
            
            .nav-container {
                width: 100%;
                flex-direction: column;
                align-items: flex-start;
                gap: 10px;
            }
            
            .nav-links {
                width: 100%;
                justify-content: flex-start;
                overflow-x: auto;
                padding-bottom: 8px;
                gap: 12px;
            }
            
            .user-actions {
                width: 100%;
                justify-content: space-between;
            }
            
            .search-box {
                flex: 1;
                max-width: 300px;
            }
            
            .carousel {
                padding-bottom: 56.25%;
            }
            
            .slide-title {
                font-size: 18px;
            }
            
            .slide-desc {
                font-size: 12px;
                max-width: 100%;
            }
            
            .section-title {
                font-size: 18px;
            }
        }
        
        /* 超小屏幕 (< 576px) */
        @media (max-width: 575px) {
            .container {
                width: 100%;
                padding: 0 8px;
            }
            
            .main-content {
                padding: 15px 0;
            }
            
            /* 移动端：每行最多两组数据 */
            .video-grid {
                grid-template-columns: repeat(2, 1fr);
                gap: 10px;
            }
            
            .header-content {
                flex-direction: column;
                align-items: flex-start;
                gap: 8px;
                padding: 8px 0;
            }
            
            .logo {
                font-size: 20px;
                margin-right: 0;
            }
            
            .nav-container {
                width: 100%;
                flex-direction: column;
                align-items: flex-start;
                gap: 8px;
            }
            
            .nav-links {
                width: 100%;
                justify-content: flex-start;
                overflow-x: auto;
                padding-bottom: 6px;
                gap: 10px;
            }
            
            .nav-links a {
                font-size: 13px;
            }
            
            .user-actions {
                width: 100%;
                justify-content: space-between;
                gap: 10px;
            }
            
            .search-box {
                flex: 1;
                max-width: 100%;
            }
            
            .search-box input {
                max-width: none;
            }
            
            .carousel {
                padding-bottom: 56.25%;
                margin-bottom: 15px;
            }
            
            .slide-title {
                font-size: 16px;
            }
            
            .slide-desc {
                font-size: 12px;
                max-width: 100%;
                display: none; /* 小屏幕隐藏描述 */
            }
            
            .section-title {
                font-size: 16px;
            }
            
            .section-more {
                font-size: 12px;
            }
            
            .video-info {
                padding: 8px;
            }
            
            .video-title {
                font-size: 12px;
            }
            
            .video-meta {
                font-size: 10px;
            }
        }
        
        /* 极窄屏幕 (< 400px) */
        @media (max-width: 400px) {
            .video-grid {
                grid-template-columns: repeat(2, 1fr);
                gap: 8px;
            }
            
            .nav-links a {
                font-size: 12px;
            }
            
            .search-box input {
                font-size: 12px;
            }
            
            .video-info {
                padding: 6px;
            }
            
            .video-title {
                font-size: 11px;
                -webkit-line-clamp: 2;
            }
            
            .video-meta {
                font-size: 9px;
            }
        }
    </style>
</head>

    <script>
        // 轮播图功能
        function initCarousel(slidesData) {
            const carousel = document.querySelector('.carousel');
            if (!carousel || !slidesData || slidesData.length === 0) return;
            
            // 清空现有内容
            carousel.innerHTML = '';
            
            // 创建轮播图幻灯片
            slidesData.forEach((slide, index) => {
                const slideElement = document.createElement('div');
                slideElement.className = `carousel-slide ${index === 0 ? 'active' : ''}`;
                const imageUrl = slide.poster || slide.image || '';
                const slideTitle = slide.title || '视频标题';
                const slideType = slide.type || '';
                slideElement.style.backgroundImage = `linear-gradient(rgba(0,0,0,0.5), rgba(0,0,0,0.5)), url('${imageUrl}')`;
                slideElement.innerHTML = `
                    <div class="slide-content">
                        <h2 class="slide-title">${slideTitle}</h2>
                        <p class="slide-desc">${slideType}</p>
                    </div>
                `;
                slideElement.addEventListener('click', () => {
                    const videoUrl = slide.video_url || '';
                    if (videoUrl) {
                        window.location.href = `player.html?url=${btoa(encodeURIComponent(videoUrl))}&title=${btoa(encodeURIComponent(slideTitle))}`;
                    }
                });
                carousel.appendChild(slideElement);
            });
            
            // 创建轮播图控制按钮
            const controlsElement = document.createElement('div');
            controlsElement.className = 'carousel-controls';
            slidesData.forEach((_, index) => {
                const btn = document.createElement('div');
                btn.className = `carousel-btn ${index === 0 ? 'active' : ''}`;
                btn.dataset.slide = index;
                btn.addEventListener('click', () => showSlide(index));
                controlsElement.appendChild(btn);
            });
            carousel.appendChild(controlsElement);
            
            // 轮播图切换功能
            let currentSlide = 0;
            const slides = document.querySelectorAll('.carousel-slide');
            const btns = document.querySelectorAll('.carousel-btn');
            
            function showSlide(index) {
                if (!slides[index] || !btns[index]) return;
                slides.forEach((slide, i) => {
                    slide.classList.remove('active');
                    if (btns[i]) {
                        btns[i].classList.remove('active');
                    }
                });
                slides[index].classList.add('active');
                btns[index].classList.add('active');
                currentSlide = index;
            }
            
            // 自动轮播
            let slideInterval = setInterval(() => {
                const nextSlide = (currentSlide + 1) % slides.length;
                showSlide(nextSlide);
            }, 5000);
            
            // 鼠标悬停暂停轮播
            carousel.addEventListener('mouseenter', () => {
                clearInterval(slideInterval);
            });
            
            carousel.addEventListener('mouseleave', () => {
                slideInterval = setInterval(() => {
                    const nextSlide = (currentSlide + 1) % slides.length;
                    showSlide(nextSlide);
                }, 5000);
            });
        }
        
        // 更新导航菜单
        function updateNavigationMenu(menuData) {
            const navLinks = document.querySelector('.nav-links');
            if (navLinks && menuData && menuData.length > 0) {
                // 清空导航链接
                navLinks.innerHTML = '';
                
                // 添加首页链接
                const homeLink = document.createElement('a');
                homeLink.href = 'index.html';
                homeLink.textContent = '首页';
                homeLink.classList.add('active');
                navLinks.appendChild(homeLink);
                
                // 添加新的导航链接
                menuData.forEach(item => {
                    if (item.name && item.channel_key) {
                        const link = document.createElement('a');
                        link.href = `channel.html?type=${item.channel_key}`;
                        link.textContent = item.name;
                        navLinks.appendChild(link);
                    }
                });
            }
        }
        
        // 更新通知栏
        function updateNotificationBar(notificationData) {
            if (notificationData && notificationData.enabled) {
                const marqueeContent = document.querySelector('.marquee-content');
                if (marqueeContent) {
                    marqueeContent.textContent = notificationData.text || '';
                }
            }
        }
        
        // 更新模块内容
        function updateModules(sectionsData) {
            const mainContent = document.querySelector('.content-area');
            if (!mainContent || !sectionsData || sectionsData.length === 0) return;
            
            // 找到所有推荐模块
            const recommendSections = mainContent.querySelectorAll('.recommend-section');
            
            sectionsData.forEach((section, index) => {
                if (recommendSections[index]) {
                    const sectionElement = recommendSections[index];
                    const titleElement = sectionElement.querySelector('.section-title');
                    const moreLink = sectionElement.querySelector('.section-more');
                    const videoGrid = sectionElement.querySelector('.video-grid');
                    
                    if (titleElement) {
                        titleElement.textContent = section.display_name || section.name || '模块名称';
                    }
                    if (moreLink) {
                        moreLink.href = `channel.html?type=${section.id || section.channel_key || 'rmtj'}`;
                    }
                    
                    if (videoGrid && section.movies && section.movies.length > 0) {
                        videoGrid.innerHTML = '';
                        section.movies.forEach(movie => {
                            if (movie.title && movie.video_url) {
                                const videoItem = document.createElement('div');
                                videoItem.className = 'video-item';
                                const posterUrl = movie.poster || '';
                                videoItem.innerHTML = `
                                    <a href="player.html?url=${btoa(encodeURIComponent(movie.video_url))}&title=${btoa(encodeURIComponent(movie.title))}&poster=${btoa(encodeURIComponent(posterUrl))}">
                                        <div class="video-thumb-container"> 
                                            <img src="${posterUrl}" alt="${movie.title}" class="video-thumb">
                                        </div>
                                        <div class="video-info">

        // 创建并执行脚本
        function executeScriptContent(scriptHtml, container) {
            console.log('开始执行脚本内容:', scriptHtml);
            
            // 创建一个临时div来解析HTML
            const tempDiv = document.createElement('div');
            tempDiv.innerHTML = scriptHtml;
            
            console.log('解析后的HTML:', tempDiv.innerHTML);
            
            // 先添加非script元素（如ins标签）
            const nonScripts = tempDiv.querySelectorAll(':not(script)');
            console.log('找到非script元素:', nonScripts.length);
            nonScripts.forEach(element => {
                const clonedElement = element.cloneNode(true);
                container.appendChild(clonedElement);
                console.log('添加元素:', clonedElement.tagName, clonedElement.className);
                
                // 如果是ins标签，设置display属性为block
                if (clonedElement.tagName === 'INS') {
                    clonedElement.style.display = 'block';
                    clonedElement.style.width = '100%';
                    clonedElement.style.height = '250px';
                    console.log('设置ins标签样式:', clonedElement.style.cssText);
                }
            });
            
            // 查找所有script标签
            const scripts = tempDiv.querySelectorAll('script');
            console.log('找到script标签:', scripts.length);
            
            // 分离脚本：先加载外部脚本，再执行内联脚本
            const externalScripts = [];
            const inlineScripts = [];
            
            scripts.forEach(script => {
                if (script.src) {
                    externalScripts.push(script);
                } else {
                    inlineScripts.push(script);
                }
            });
            
            console.log('外部脚本数量:', externalScripts.length);
            console.log('内联脚本数量:', inlineScripts.length);
            
            // 加载外部脚本
            let loadedScripts = 0;
            
            if (externalScripts.length === 0) {
                // 没有外部脚本，直接执行内联脚本
                executeInlineScripts();
            } else {
                // 加载所有外部脚本
                externalScripts.forEach(script => {
                    console.log('加载外部脚本:', script.src);
                    
                    const newScript = document.createElement('script');
                    
                    // 复制所有属性，但移除async属性
                    Array.from(script.attributes).forEach(attr => {
                        if (attr.name !== 'async') {
                            newScript.setAttribute(attr.name, attr.value);
                            console.log(`  属性: ${attr.name} = ${attr.value}`);
                        }
                    });
                    
                    // 设置脚本加载完成后的回调
                    newScript.onload = function() {
                        console.log('外部脚本加载完成:', script.src);
                        loadedScripts++;
                        
                        // 所有外部脚本都加载完成后，执行内联脚本
                        if (loadedScripts === externalScripts.length) {
                            executeInlineScripts();
                        }
                    };
                    
                    newScript.onerror = function() {
                        console.error('外部脚本加载失败:', script.src);
                        loadedScripts++;
                        
                        // 即使有脚本加载失败，也继续执行
                        if (loadedScripts === externalScripts.length) {
                            executeInlineScripts();
                        }
                    };
                    
                    // 添加到容器
                    container.appendChild(newScript);
                    console.log(`  已添加到容器`);
                });
            }
            
            // 执行内联脚本
            function executeInlineScripts() {
                console.log('开始执行内联脚本');
                
                inlineScripts.forEach((script, index) => {
                    console.log(`处理第${index + 1}个内联脚本`);
                    
                    const newScript = document.createElement('script');
                    
                    // 复制所有属性
                    Array.from(script.attributes).forEach(attr => {
                        newScript.setAttribute(attr.name, attr.value);
                        console.log(`  属性: ${attr.name} = ${attr.value}`);
                    });
                    
                    // 复制内容
                    newScript.textContent = script.textContent;
                    console.log(`  内容长度: ${script.textContent.length}`);
                    
                    // 添加到容器
                    container.appendChild(newScript);
                    console.log(`  已添加到容器`);
                });
                
                console.log('脚本执行完成');
            }
        }

    <!-- 安全措施脚本 -->
    <script>
        // 禁止右键菜单
        document.addEventListener('contextmenu', function(e) {
            e.preventDefault();
        });
        
        // 禁止F12键
        document.addEventListener('keydown', function(e) {
            // F12键
            if (e.keyCode === 123) {
                e.preventDefault();
            }
            // Ctrl+Shift+I
            if (e.ctrlKey && e.shiftKey && e.keyCode === 73) {
                e.preventDefault();
            }
            // Ctrl+Shift+C
            if (e.ctrlKey && e.shiftKey && e.keyCode === 67) {
                e.preventDefault();
            }
            // Ctrl+Shift+J
            if (e.ctrlKey && e.shiftKey && e.keyCode === 74) {
                e.preventDefault();
            }
            // Ctrl+U
            if (e.ctrlKey && e.keyCode === 85) {
                e.preventDefault();
            }
        });
        
        // 简单的加密函数
        function encryptUrl(url) {
            return btoa(encodeURIComponent(url));
        }
        
        // 简单的解密函数
        function decryptUrl(encryptedUrl) {
            return decodeURIComponent(atob(encryptedUrl));
        }
        
        // 检测爬取行为
        function detectCrawling() {
            // 检测请求频率
            let requestCount = 0;
            setInterval(function() {
                if (requestCount > 50) {
                    requestCount = 0;
                }
            }, 1000);
            
            // 重写fetch和XMLHttpRequest
            const originalFetch = window.fetch;
            window.fetch = function() {
                requestCount++;
                return originalFetch.apply(this, arguments);
            };
            
            const originalXHR = window.XMLHttpRequest;
            window.XMLHttpRequest = function() {
                const xhr = new originalXHR();
                const originalOpen = xhr.open;
                xhr.open = function() {
                    requestCount++;
                    return originalOpen.apply(this, arguments);
                };
                return xhr;
            };
        }
        
        // 初始化安全措施
        detectCrawling();
    </script>
